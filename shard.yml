name: clevis-zfs
version: 0.2.3
description: |
  Tang client + ZFS native encryption driver for FreeBSD: unattended
  unlock of encrypted ZFS datasets at boot via the Tang protocol
  (Network-Bound Disk Encryption). Successor to crystal-clevis-geli,
  using ZFS native encryption instead of GELI to benefit from
  pre-encryption compression and `zfs send -w` portable backups.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
crystal: ">= 1.19.0"

targets:
  clevis-zfs:
    main: src/cli.cr

dependencies:
  jose:
    github: aloli-crystal/jose
    version: ~> 0.1.2

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
